# Compile "Fanny in 2 Trom" pour iPhone et l'envoie sur TestFlight.
#
# Lancement : onglet "Actions" du dépôt > "iPhone → TestFlight" > "Run workflow".
# Secrets à créer une fois (Settings > Secrets and variables > Actions) : voir README, section TestFlight.
#
# Étape 1 (Linux)  : Unity génère le projet Xcode.
# Étape 2 (macOS)  : Xcode compile, signe (signature automatique via la clé API App Store Connect)
#                    et envoie le build sur App Store Connect / TestFlight.

name: iPhone → TestFlight

on:
  workflow_dispatch:
  push:
    tags: ['v*']

concurrency:
  group: ios-testflight
  cancel-in-progress: false

env:
  UNITY_VERSION: 6000.0.84f1
  BUNDLE_ID: com.yateo.fannyin2trom

jobs:
  unity:
    name: 1. Unity → projet Xcode
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Vérifier les secrets Unity
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          missing=0
          [ -n "$UNITY_EMAIL" ] || { echo "::error::Secret UNITY_EMAIL manquant"; missing=1; }
          [ -n "$UNITY_PASSWORD" ] || { echo "::error::Secret UNITY_PASSWORD manquant"; missing=1; }
          if [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; then
            echo "::error::Il faut UNITY_LICENSE (licence Personal) ou UNITY_SERIAL (licence Pro)"; missing=1
          fi
          exit $missing

      - name: Libérer de l'espace disque
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v4

      - name: Cache de la bibliothèque Unity
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-iOS-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-iOS-

      - name: Générer le projet Xcode
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: ${{ env.UNITY_VERSION }}
          targetPlatform: iOS
          buildName: FannyIn2Trom
          buildMethod: FannyIn2Trom.EditorTools.FannyBuild.BuildIOSCI
          versioning: None
          customParameters: -buildNumber ${{ github.run_number }} -appleTeamId ${{ secrets.APPLE_TEAM_ID }}

      # tar conserve les droits d'exécution des scripts du projet Xcode
      - name: Empaqueter le projet Xcode
        run: tar -czf xcode-project.tgz -C build/iOS FannyIn2Trom

      - uses: actions/upload-artifact@v4
        with:
          name: xcode-project
          path: xcode-project.tgz
          retention-days: 3

  testflight:
    name: 2. Xcode → TestFlight
    needs: unity
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ASC_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.APPSTORE_P8 }}
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Vérifier les secrets Apple
        run: |
          missing=0
          for v in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 TEAM_ID; do
            [ -n "${!v}" ] || { echo "::error::Secret Apple manquant ($v) - voir README"; missing=1; }
          done
          exit $missing

      - uses: actions/download-artifact@v4
        with:
          name: xcode-project

      - name: Préparer le projet et la clé API
        run: |
          mkdir -p xcode && tar -xzf xcode-project.tgz -C xcode
          echo "PROJECT_DIR=$PWD/xcode/FannyIn2Trom" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/keys/AuthKey_$ASC_KEY_ID.p8" >> "$GITHUB_ENV"
          # pas de chiffrement spécifique : évite la question "export compliance" dans TestFlight
          PLIST="$PWD/xcode/FannyIn2Trom/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$PLIST" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$PLIST"
          xcodebuild -version

      - name: Compiler et signer (archive)
        run: |
          set -o pipefail
          ARGS=(-project "$PROJECT_DIR/Unity-iPhone.xcodeproj" -scheme Unity-iPhone -configuration Release
                -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/Fanny.xcarchive"
                -allowProvisioningUpdates
                -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID"
                DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID")
          if ! xcodebuild "${ARGS[@]}" archive | tail -n 80; then
            echo "::warning::Archive signée impossible (aucun appareil enregistré ?) : archive non signée, la signature se fera à l'export."
            xcodebuild "${ARGS[@]}" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO archive | tail -n 80
          fi

      - name: Envoyer sur TestFlight
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/Fanny.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -n 80
          echo "### Build ${{ github.run_number }} envoyé sur App Store Connect" >> "$GITHUB_STEP_SUMMARY"
          echo "Il apparaît dans TestFlight après le traitement par Apple (5 à 30 min)." >> "$GITHUB_STEP_SUMMARY"

      - name: Nettoyer la clé
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
